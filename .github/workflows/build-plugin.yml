name: Build Plugin Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: jellyfin-subtitleminer-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  TARGET_ABI: 10.11.9.0

jobs:
  build-plugin:
    name: Build installable plugin
    runs-on: ubuntu-latest
    outputs:
      asset_name: ${{ steps.version.outputs.asset_name }}
      is_release: ${{ steps.version.outputs.is_release }}
      package: ${{ steps.version.outputs.package }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Check frontend
        run: npm run check --prefix frontend

      - name: Resolve build version
        id: version
        run: scripts/resolve-plugin-version.sh

      - name: Build plugin package
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: scripts/jellyfin.sh package

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-miner-${{ steps.version.outputs.version }}
          path: ${{ steps.version.outputs.package }}
          if-no-files-found: error

  release-plugin:
    name: Publish release and repository manifest
    needs: build-plugin
    if: needs.build-plugin.outputs.is_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download plugin package
        uses: actions/download-artifact@v4
        with:
          name: jellyfin-miner-${{ needs.build-plugin.outputs.version }}
          path: artifacts

      - name: Publish versioned release
        env:
          ASSET_NAME: ${{ needs.build-plugin.outputs.asset_name }}
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ needs.build-plugin.outputs.package }}
          PLUGIN_VERSION: ${{ needs.build-plugin.outputs.version }}
        run: scripts/publish-plugin-release.sh

      - name: Prepare plugin repository
        env:
          CURRENT_VERSION: ${{ needs.build-plugin.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE: ${{ needs.build-plugin.outputs.package }}
        run: scripts/generate-plugin-repository.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload plugin repository pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/plugin-repository

  deploy-pages:
    name: Deploy plugin repository
    needs:
      - build-plugin
      - release-plugin
    if: needs.build-plugin.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy plugin repository to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
